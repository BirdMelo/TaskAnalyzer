[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-analyzer"
version = "0.6.0"
description = "Módulo de análise de produtividade de tarefas em memória."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88
