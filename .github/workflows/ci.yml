name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test with Conda
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: task-analyzer
          environment-file: environment.yml
          auto-activate-base: false
          miniforge-version: latest

      - name: Run test suite
        shell: bash -el {0}
        run: python -m pytest

      - name: Check Python syntax
        shell: bash -el {0}
        run: python -m compileall -q src tests

      - name: Build package
        shell: bash -el {0}
        run: python -m build

      - name: Install built package
        shell: bash -el {0}
        run: python -m pip install dist/*.whl

      - name: Check package import
        shell: bash -el {0}
        run: python -c "import task_analyzer; assert task_analyzer.__version__ == '0.5.0'"

      - name: Run Pylint
        shell: bash -el {0}
        run: python -m pylint src tests --fail-under=8.0
